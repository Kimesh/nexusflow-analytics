name: NexusFlow CI/CD & Security Hardening

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Java Services Build & Unit/Integration Tests
  # ---------------------------------------------------------------------------
  build-java-services:
    name: Build & Test Java 17 Microservices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Core Gateway API
        working-directory: services/core-gateway-api
        run: mvn clean test

      - name: Build Stream Processor
        working-directory: services/stream-processor
        run: mvn clean package -DskipTests

  # ---------------------------------------------------------------------------
  # 2. Python AI Worker Tests
  # ---------------------------------------------------------------------------
  test-python-worker:
    name: Test AI Audit Worker (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: services/ai-audit-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        working-directory: services/ai-audit-worker
        run: pytest tests/

  # ---------------------------------------------------------------------------
  # 3. Security Hardening & Container Vulnerability Scan (SOC2 Compliance)
  # ---------------------------------------------------------------------------
  security-vulnerability-scan:
    name: Trivy Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-java-services, test-python-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Repository
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking alert report
