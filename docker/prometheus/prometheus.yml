global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "core-gateway-api"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 3s
    static_configs:
      - targets: ["core-gateway-api:8080"]

  - job_name: "stream-processor"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 3s
    static_configs:
      - targets: ["stream-processor:8081"]

  - job_name: "ai-audit-worker"
    metrics_path: "/metrics"
    scrape_interval: 3s
    static_configs:
      - targets: ["ai-audit-worker:8000"]
